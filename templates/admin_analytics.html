{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <!-- Page Heading -->
    <div class="text-center mb-5">
        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill mb-3">
            <i class="bi bi-bar-chart-line me-1"></i> Real‑time Insights
        </span>
        <h2 class="fw-bolder display-5" style="color: #1e1b4b;">
            Admin <span style="color: #ffb703;">Analytics</span>
        </h2>
        <p class="text-muted">Track the growth of your digital library at a glance.</p>
    </div>

    <!-- Stats Cards with Glassmorphism -->
    <div class="row g-4 justify-content-center">
        <!-- Total Books -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 h-100 rounded-4 overflow-hidden position-relative"
                 style="background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(30,27,75,0.08);">
                <div class="card-body text-center p-4 p-xl-5">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-4"
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #4338ca, #818cf8); box-shadow: 0 12px 24px rgba(67,56,202,0.2);">
                        <i class="bi bi-book text-white fs-2"></i>
                    </div>
                    <h5 class="fw-bold mb-1" style="color: #1e1b4b;">Total Books</h5>
                    <p class="display-4 fw-bolder mb-0" style="color: #4338ca;">{{ total_books }}</p>
                </div>
            </div>
        </div>

        <!-- Total Downloads -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 h-100 rounded-4 overflow-hidden position-relative"
                 style="background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(30,27,75,0.08);">
                <div class="card-body text-center p-4 p-xl-5">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-4"
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #10b981, #34d399); box-shadow: 0 12px 24px rgba(16,185,129,0.2);">
                        <i class="bi bi-download text-white fs-2"></i>
                    </div>
                    <h5 class="fw-bold mb-1" style="color: #1e1b4b;">Total Downloads</h5>
                    <p class="display-4 fw-bolder mb-0" style="color: #10b981;">{{ total_downloads }}</p>
                </div>
            </div>
        </div>

        <!-- Total Users -->
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="card border-0 h-100 rounded-4 overflow-hidden position-relative"
                 style="background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(30,27,75,0.08);">
                <div class="card-body text-center p-4 p-xl-5">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3 rounded-4"
                         style="width: 70px; height: 70px; background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 12px 24px rgba(245,158,11,0.2);">
                        <i class="bi bi-people-fill text-white fs-2"></i>
                    </div>
                    <h5 class="fw-bold mb-1" style="color: #1e1b4b;">Total Users</h5>
                    <p class="display-4 fw-bolder mb-0" style="color: #f59e0b;">{{ total_users }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Subtle hover lift on cards (desktop) */
    @media (hover: hover) {
        .card:hover {
            transform: translateY(-6px);
            transition: transform 0.3s ease;
        }
    }
    /* Responsive adjustments */
    @media (max-width: 768px) {
        .display-5 { font-size: 2.2rem !important; }
        .display-4 { font-size: 2.2rem !important; }
        .card .d-inline-flex {
            width: 60px !important;
            height: 60px !important;
        }
        .card .d-inline-flex i {
            font-size: 1.6rem !important;
        }
    }
    @media (max-width: 576px) {
        .display-5 { font-size: 1.8rem !important; }
        .display-4 { font-size: 1.8rem !important; }
        .card .d-inline-flex {
            width: 50px !important;
            height: 50px !important;
        }
        .card .d-inline-flex i {
            font-size: 1.4rem !important;
        }
        .container.py-5 { padding-top: 2rem !important; padding-bottom: 2rem !important; }
    }
</style>
{% endblock %}
