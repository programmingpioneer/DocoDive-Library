{% extends 'base.html' %}

{% block content %}
<div class="container py-4 py-md-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
        <h2 class="fw-bold text-primary mb-0">
            <i class="bi bi-pencil-square me-2"></i>Edit Book
        </h2>
        <a href="/admin/books" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="bi bi-arrow-left me-1"></i> Back to Manage Books
        </a>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-4 p-lg-5">
                    <form method="POST" action="/admin/edit/{{ book.id }}" enctype="multipart/form-data">
                        <input type="hidden" name="_csrf_token" value="{{ session._csrf_token }}">
                        <!-- Title -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Title</label>
                            <input type="text" name="title" class="form-control form-control-lg rounded-3" value="{{ book.title }}" required>
                        </div>

                        <!-- Category & Author -->
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Category</label>
                                <select name="category" class="form-select form-select-lg rounded-3" required>
                                    {% for cat in categories %}
                                        <option value="{{ cat.level }}" {% if cat.id == book.category_id %}selected{% endif %}>
                                            {{ cat.level }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Author</label>
                                <input type="text" name="author" class="form-control form-control-lg rounded-3" value="{{ book.author }}" required>
                            </div>
                        </div>

                        <!-- Language -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Language</label>
                            <input type="text" name="language" class="form-control form-control-lg rounded-3" value="{{ book.language }}">
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Description</label>
                            <textarea name="desc" class="form-control rounded-3" rows="4" style="resize: vertical;">{{ book.description }}</textarea>
                        </div>

                        <!-- Cover Image URL -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Cover Image URL</label>
                            <input type="url" name="img" class="form-control form-control-lg rounded-3" value="{{ book.image_url }}" placeholder="https://...">
                        </div>

                        <!-- Upload New Cover Image -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Upload New Cover Image (JPG/PNG)</label>
                            <input type="file" name="cover_image" class="form-control form-control-lg rounded-3" accept="image/*">
                            <small class="text-muted d-block mt-1">Current: {{ book.image_url or 'None' }}</small>
                        </div>

                        <!-- Replace PDF -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-uppercase" style="letter-spacing: 0.5px; color: #6b7280;">Replace PDF (optional)</label>
                            <input type="file" name="pdf_file" class="form-control form-control-lg rounded-3" accept=".pdf">
                            <small class="text-muted d-block mt-1">Current: {{ book.link }}</small>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check-circle fs-5"></i> Update Book
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Keep existing dark mode support */
    [data-bs-theme="dark"] .card {
        background-color: #2a2a3d !important;
        color: #e0e0e0;
    }
    [data-bs-theme="dark"] label {
        color: #e0e0e0 !important;
    }
    [data-bs-theme="dark"] .form-control,
    [data-bs-theme="dark"] .form-select,
    [data-bs-theme="dark"] textarea {
        background-color: #3a3a4d !important;
        color: #fff !important;
        border-color: #555 !important;
    }
    [data-bs-theme="dark"] .text-muted {
        color: #b0b0b0 !important;
    }

    /* Responsive hover effect for button */
    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(34,197,94,0.3) !important;
    }

    /* Additional mobile optimizations */
    @media (max-width: 576px) {
        .card-body {
            padding: 1.5rem !important;
        }
        h2.fw-bold {
            font-size: 1.4rem;
        }
        .btn-outline-secondary {
            width: 100%;
        }
    }
</style>
{% endblock %}
