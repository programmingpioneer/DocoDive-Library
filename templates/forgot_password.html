<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - DocoDive</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons (optional, for visual touches) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #4338ca;
      --primary-light: #818cf8;
      --accent: #ffb703;
      --dark: #1e1b4b;
      --bg: #f8faff;
      --card-bg: #ffffff;
      --text: #334155;
      --error: #ef4444;
      --success: #10b981;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --transition: 0.25s ease;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .container {
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 30px 35px;
      transition: var(--transition);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header .logo-icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: var(--primary);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--dark);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color var(--transition);
      background: #fff;
    }
    .input-wrapper input:focus {
      border-color: var(--primary-light);
    }
    .input-wrapper input.error {
      border-color: var(--error);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: #3730a3;
      transform: translateY(-1px);
    }
    .btn-accent {
      background: var(--accent);
      color: var(--dark);
    }
    .btn-accent:hover {
      background: #e6a800;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      font-size: 13px;
      margin-top: 8px;
      font-weight: 500;
      display: none;
    }
    .message.error { color: var(--error); }
    .message.success { color: var(--success); }
    .code-boxes {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .code-boxes input {
      width: 60px;
      height: 60px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      background: #fff;
      transition: border-color var(--transition);
    }
    .code-boxes input:focus {
      border-color: var(--primary-light);
    }
    .hidden {
      display: none !important;
    }
    .fade-in {
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .timer {
      font-size: 13px;
      text-align: center;
      color: #64748b;
      margin-bottom: 15px;
    }
    .timer span {
      font-weight: 600;
      color: var(--dark);
    }
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px 25px;
      }
      .code-boxes input {
        width: 50px;
        height: 50px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo-icon">📚</div>
        <h1>Forgot Password</h1>
        <p id="step-description">Enter your email to receive a reset code.</p>
      </div>

      <!-- Step 1: Email form -->
      <div id="email-step">
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="message" id="email-msg"></div>
        </div>
        <button class="btn btn-primary" id="send-code-btn">
          <i class="bi bi-envelope-fill" style="margin-right:8px;"></i> Send Code
        </button>
      </div>

      <!-- Step 2: Verification code (hidden initially) -->
      <div id="code-step" class="hidden fade-in">
        <p style="text-align:center; font-weight:500; margin-bottom:10px;">
          We sent a 4‑digit code to <strong id="display-email"></strong>
        </p>
        <div class="code-boxes" id="code-inputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit1" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit2" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit3" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit4" autocomplete="off">
        </div>
        <div class="timer hidden" id="timer-display">
          Code expires in <span id="timer-minutes">10</span>:<span id="timer-seconds">00</span>
        </div>
        <div class="message" id="code-msg"></div>
        <button class="btn btn-accent" id="verify-code-btn">
          <i class="bi bi-shield-check" style="margin-right:8px;"></i> Verify Code
        </button>
        <div style="text-align:center; margin-top:12px;">
          <button id="resend-code-link" class="btn" style="background:none; color:var(--primary); text-decoration:underline; font-size:14px; padding:0; width:auto;">Resend code</button>
        </div>
      </div>

      <!-- Step 3: Success message (hidden) -->
      <div id="success-step" class="hidden fade-in" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:10px;">✅</div>
        <h3 style="color:var(--dark); margin-bottom:8px;">Reset Link Sent!</h3>
        <p style="color:#64748b; font-size:14px;">Check your email for the password reset link. It expires in 30 minutes.</p>
        <button class="btn btn-primary" onclick="window.location.href='/user/login'" style="margin-top:20px;">
          Go to Login
        </button>
      </div>
    </div>
    <div class="back-link">
      <a href="/user/login">← Back to login</a>
    </div>
  </div>

  <script>
    // DOM Elements
    const emailInput = document.getElementById('email');
    const emailStep = document.getElementById('email-step');
    const codeStep = document.getElementById('code-step');
    const successStep = document.getElementById('success-step');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const verifyCodeBtn = document.getElementById('verify-code-btn');
    const resendLink = document.getElementById('resend-code-link');
    const emailMsg = document.getElementById('email-msg');
    const codeMsg = document.getElementById('code-msg');
    const displayEmail = document.getElementById('display-email');
    const digitInputs = document.querySelectorAll('.code-digit');
    const timerDisplay = document.getElementById('timer-display');
    const timerMinutes = document.getElementById('timer-minutes');
    const timerSeconds = document.getElementById('timer-seconds');
    const stepDescription = document.getElementById('step-description');

    let currentEmail = '';
    let timerInterval = null;
    let codeExpiresAt = null;

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = `message ${type}`;
      element.style.display = 'block';
    }

    function clearMessage(element) {
      element.style.display = 'none';
    }

    // Auto-focus next digit input
    digitInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 1 && idx < digitInputs.length - 1) {
          digitInputs[idx + 1].focus();
        }
        // Auto-submit if all digits filled
        if (idx === digitInputs.length - 1 && val.length === 1) {
          checkAllDigitsFilled();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          digitInputs[idx - 1].focus();
        }
      });
    });

    function getCode() {
      let code = '';
      digitInputs.forEach(input => code += input.value);
      return code;
    }

    function clearCodeInputs() {
      digitInputs.forEach(input => input.value = '');
      digitInputs[0].focus();
    }

    function checkAllDigitsFilled() {
      if (getCode().length === 4) {
        // Optional: could auto-trigger verify, but better to let user click
      }
    }

    function startTimer(minutes) {
      clearInterval(timerInterval);
      codeExpiresAt = new Date(Date.now() + minutes * 60000);
      timerDisplay.classList.remove('hidden');
      updateTimerDisplay();
      timerInterval = setInterval(updateTimerDisplay, 1000);
    }

    function updateTimerDisplay() {
      const now = new Date();
      const diff = codeExpiresAt - now;
      if (diff <= 0) {
        clearInterval(timerInterval);
        timerDisplay.classList.add('hidden');
        showMessage(codeMsg, 'Verification code has expired. Please request a new one.', 'error');
        verifyCodeBtn.disabled = true;
        return;
      }
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      timerMinutes.textContent = String(mins).padStart(2, '0');
      timerSeconds.textContent = String(secs).padStart(2, '0');
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerDisplay.classList.add('hidden');
    }

    // Step 1: Send code
    sendCodeBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage(emailMsg, 'Please enter your email address.', 'error');
        emailInput.classList.add('error');
        return;
      }
      // Basic email validation
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        showMessage(emailMsg, 'Please enter a valid email.', 'error');
        emailInput.classList.add('error');
        return;
      }

      clearMessage(emailMsg);
      emailInput.classList.remove('error');
      sendCodeBtn.disabled = true;
      sendCodeBtn.innerHTML = '<span class="spinner-border spinner-border-sm" style="margin-right:6px;"></span> Sending...';

      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: new URLSearchParams({ email })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          currentEmail = email;
          displayEmail.textContent = email;
          // Switch to code step
          emailStep.classList.add('hidden');
          codeStep.classList.remove('hidden');
          stepDescription.textContent = 'Enter the 4‑digit code from your email.';
          clearCodeInputs();
          clearMessage(codeMsg);
          verifyCodeBtn.disabled = false;
          // Start 10-minute timer
          startTimer(10);
        } else {
          showMessage(emailMsg, data.error || 'Something went wrong. Please try again.', 'error');
          emailInput.classList.add('error');
        }
      } catch (err) {
        console.error(err);
        showMessage(emailMsg, 'Network error. Please try again.', 'error');
      } finally {
        sendCodeBtn.disabled = false;
        sendCodeBtn.innerHTML = '<i class="bi bi-envelope-fill" style="margin-right:8px;"></i> Send Code';
      }
    });

    // Step 2: Verify code
    verifyCodeBtn.addEventListener('click', async () => {
      const code = getCode();
      if (code.length !== 4) {
        showMessage(codeMsg, 'Please enter the full 4‑digit code.', 'error');
        return;
      }

      clearMessage(codeMsg);
      verifyCodeBtn.disabled = true;
      verifyCodeBtn.innerHTML = '<span class="spinner-border spinner-border-sm" style="margin-right:6px;"></span> Verifying...';

      try {
        const response = await fetch('/verify-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: new URLSearchParams({ email: currentEmail, code })
        });

        const data = await response.json();
        if (response.ok && data.success) {
          stopTimer();
          // Show success step
          codeStep.classList.add('hidden');
          successStep.classList.remove('hidden');
          stepDescription.textContent = '';
        } else {
          showMessage(codeMsg, data.error || 'Invalid code. Please try again.', 'error');
          clearCodeInputs();
        }
      } catch (err) {
        console.error(err);
        showMessage(codeMsg, 'Network error. Please try again.', 'error');
      } finally {
        verifyCodeBtn.disabled = false;
        verifyCodeBtn.innerHTML = '<i class="bi bi-shield-check" style="margin-right:8px;"></i> Verify Code';
      }
    });

    // Resend code (re-trigger step 1)
    resendLink.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!currentEmail) return;
      resendLink.disabled = true;
      resendLink.textContent = 'Sending...';
      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-Requested-With': 'XMLHttpRequest'
          },
          body: new URLSearchParams({ email: currentEmail })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          clearCodeInputs();
          clearMessage(codeMsg);
          verifyCodeBtn.disabled = false;
          stopTimer();
          startTimer(10);
          showMessage(codeMsg, 'New code sent!', 'success');
        } else {
          showMessage(codeMsg, data.error || 'Could not resend code.', 'error');
        }
      } catch (err) {
        showMessage(codeMsg, 'Network error.', 'error');
      } finally {
        resendLink.disabled = false;
        resendLink.textContent = 'Resend code';
      }
    });

    // Allow Enter key on email field
    emailInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendCodeBtn.click();
      }
    });

    // Auto-focus first digit when code step appears
    const observer = new MutationObserver(() => {
      if (!codeStep.classList.contains('hidden') && document.activeElement !== digitInputs[0]) {
        digitInputs[0].focus();
      }
    });
    observer.observe(codeStep, { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
