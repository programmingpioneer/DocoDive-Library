<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – DocoDive</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #4338ca;
      --primary-light: #818cf8;
      --accent: #ffb703;
      --dark: #1e1b4b;
      --bg: #f8faff;
      --text: #334155;
      --error: #ef4444;
      --success: #10b981;
      --border: #e0e7ff;
      --radius: 20px;
      --shadow: 0 20px 50px rgba(30,27,75,0.1);
      --transition: 0.25s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      color: var(--text);
    }

    /* Decorative background blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.2;
      z-index: 0;
    }
    .blob-1 { width: 280px; height: 280px; background: var(--primary); top: -80px; left: -80px; }
    .blob-2 { width: 220px; height: 220px; background: var(--accent); bottom: -60px; right: -60px; }
    .blob-3 { width: 160px; height: 160px; background: var(--primary-light); top: 50%; right: 5%; }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
    }

    /* Brand header */
    .brand-block {
      text-align: center;
      margin-bottom: 24px;
      animation: fadeInUp 0.5s ease-out;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 18px;
      margin-bottom: 10px;
      box-shadow: 0 10px 24px rgba(67,56,202,0.2);
      color: white;
      font-size: 1.7rem;
    }
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
    }
    .brand-sub {
      color: #6b7280;
      font-size: 0.88rem;
      font-weight: 400;
    }

    /* Main card */
    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 35px 28px 30px;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header .icon-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: rgba(67,56,202,0.08);
      border-radius: 50%;
      margin-bottom: 12px;
    }
    .header .icon-circle i {
      font-size: 1.8rem;
      color: var(--primary);
    }
    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .header p {
      font-size: 13px;
      color: #6b7280;
    }

    /* Form elements */
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 5px;
      color: var(--dark);
      letter-spacing: 0.2px;
    }
    .input-wrapper { position: relative; }
    .input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: all var(--transition);
      background: rgba(255,255,255,0.9);
    }
    .input-wrapper input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(67,56,202,0.1);
    }
    .input-wrapper input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.2px;
    }
    .btn-primary-custom {
      background: var(--dark);
      color: #fff;
      box-shadow: 0 8px 20px rgba(30,27,75,0.25);
    }
    .btn-primary-custom:hover {
      background: #312e81;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(30,27,75,0.35);
    }
    .btn-accent {
      background: var(--accent);
      color: var(--dark);
      box-shadow: 0 8px 20px rgba(255,183,3,0.25);
    }
    .btn-accent:hover {
      background: #e6a800;
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Messages */
    .message {
      font-size: 12.5px;
      margin-top: 6px;
      font-weight: 500;
      display: none;
    }
    .message.error { color: var(--error); display: block; }
    .message.success { color: var(--success); display: block; }

    /* Code boxes */
    .code-boxes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .code-boxes input {
      width: 56px;
      height: 56px;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      outline: none;
      font-family: inherit;
      background: rgba(255,255,255,0.9);
      transition: all var(--transition);
    }
    .code-boxes input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(67,56,202,0.1);
    }

    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .back-link a:hover { text-decoration: underline; }

    .timer {
      font-size: 12px;
      text-align: center;
      color: #6b7280;
      margin-bottom: 14px;
    }
    .timer span { font-weight: 600; color: var(--dark); }

    .text-link {
      color: var(--primary);
      text-decoration: underline;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      width: auto;
    }
    .text-link:hover { color: #312e81; }

    /* Responsive */
    @media (max-width: 500px) {
      body { padding: 16px; align-items: flex-start; padding-top: 40px; }
      .card { padding: 24px 18px 22px; border-radius: 24px; }
      .brand-title { font-size: 1.5rem; }
      .header h2 { font-size: 19px; }
      .code-boxes input { width: 48px; height: 48px; font-size: 22px; }
      .code-boxes { gap: 7px; }
      .bg-blob { display: none; }
      .btn { font-size: 14px; padding: 11px 16px; }
    }
  </style>
</head>
<body>
  <!-- Decorative blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="container">
    <!-- Brand -->
    <div class="brand-block">
      <div class="brand-icon"><i class="bi bi-book-half"></i></div>
      <h1 class="brand-title">DocoDive</h1>
      <p class="brand-sub">Secure Password Recovery</p>
    </div>

    <div class="card">
      <div class="header">
        <div class="icon-circle"><i class="bi bi-shield-lock-fill"></i></div>
        <h2>Forgot Password</h2>
        <p id="step-description">Enter your email to receive a reset code.</p>
      </div>

      <!-- Step 1: Email form -->
      <div id="email-step">
        <div class="form-group">
          <input type="hidden" name="_csrf_token" value="{{ session._csrf_token }}">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="message" id="email-msg"></div>
        </div>
        <button class="btn btn-primary-custom" id="send-code-btn">
          <i class="bi bi-envelope-fill me-2"></i> Send Reset Code
        </button>
      </div>

      <!-- Step 2: Verification code -->
      <div id="code-step" class="hidden fade-in">
        <input type="hidden" name="_csrf_token" value="{{ session._csrf_token }}">
        <p style="text-align:center; font-weight:500; font-size:13px; margin-bottom:10px; color:#6b7280;">
          We sent a 4‑digit code to <strong id="display-email" style="color:var(--dark);"></strong>
        </p>
        <div class="code-boxes" id="code-inputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit1" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit2" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit3" autocomplete="off">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="code-digit" id="digit4" autocomplete="off">
        </div>
        <div class="timer hidden" id="timer-display">
          Code expires in <span id="timer-minutes">10</span>:<span id="timer-seconds">00</span>
        </div>
        <div class="message" id="code-msg"></div>
        <button class="btn btn-accent" id="verify-code-btn">
          <i class="bi bi-shield-check me-2"></i> Verify Code
        </button>
        <div style="text-align:center; margin-top:12px;">
          <button id="resend-code-link" class="text-link">Resend code</button>
        </div>
      </div>

      <!-- Step 3: Success -->
      <div id="success-step" class="hidden fade-in" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:8px;">📧</div>
        <h3 style="color:var(--dark); margin-bottom:6px;">Reset Link Sent!</h3>
        <p style="color:#6b7280; font-size:13px; line-height:1.5;">
          Check your email for the password reset link.<br>It expires in 30 minutes.
        </p>
        <button class="btn btn-primary-custom" onclick="window.location.href='/user/login'" style="margin-top:18px;">
          <i class="bi bi-box-arrow-in-right me-2"></i> Go to Login
        </button>
      </div>
    </div>

    <div class="back-link">
      <a href="/user/login"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const emailInput = document.getElementById('email');
    const emailStep = document.getElementById('email-step');
    const codeStep = document.getElementById('code-step');
    const successStep = document.getElementById('success-step');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const verifyCodeBtn = document.getElementById('verify-code-btn');
    const resendLink = document.getElementById('resend-code-link');
    const emailMsg = document.getElementById('email-msg');
    const codeMsg = document.getElementById('code-msg');
    const displayEmail = document.getElementById('display-email');
    const digitInputs = document.querySelectorAll('.code-digit');
    const timerDisplay = document.getElementById('timer-display');
    const timerMinutes = document.getElementById('timer-minutes');
    const timerSeconds = document.getElementById('timer-seconds');
    const stepDescription = document.getElementById('step-description');

    let currentEmail = '';
    let timerInterval = null;
    let codeExpiresAt = null;

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = `message ${type}`;
    }
    function clearMessage(element) {
      element.style.display = 'none';
      element.className = 'message';
    }

    digitInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 1 && idx < digitInputs.length - 1) digitInputs[idx + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) digitInputs[idx - 1].focus();
      });
    });

    function getCode() {
      let code = '';
      digitInputs.forEach(input => code += input.value);
      return code;
    }
    function clearCodeInputs() {
      digitInputs.forEach(input => input.value = '');
      digitInputs[0]?.focus();
    }

    function startTimer(minutes) {
      clearInterval(timerInterval);
      codeExpiresAt = new Date(Date.now() + minutes * 60000);
      timerDisplay.classList.remove('hidden');
      updateTimerDisplay();
      timerInterval = setInterval(updateTimerDisplay, 1000);
    }
    function updateTimerDisplay() {
      const now = new Date();
      const diff = codeExpiresAt - now;
      if (diff <= 0) {
        clearInterval(timerInterval);
        timerDisplay.classList.add('hidden');
        showMessage(codeMsg, 'Code expired. Please request a new one.', 'error');
        verifyCodeBtn.disabled = true;
        return;
      }
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      timerMinutes.textContent = String(mins).padStart(2, '0');
      timerSeconds.textContent = String(secs).padStart(2, '0');
    }
    function stopTimer() {
      clearInterval(timerInterval);
      timerDisplay.classList.add('hidden');
    }

    // Step 1: Send code
    sendCodeBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage(emailMsg, 'Please enter your email address.', 'error');
        emailInput.classList.add('error');
        return;
      }
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        showMessage(emailMsg, 'Please enter a valid email.', 'error');
        emailInput.classList.add('error');
        return;
      }
      clearMessage(emailMsg);
      emailInput.classList.remove('error');
      sendCodeBtn.disabled = true;
      sendCodeBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Sending...';

      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
          body: new URLSearchParams({ email })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          currentEmail = email;
          displayEmail.textContent = email;
          emailStep.classList.add('hidden');
          codeStep.classList.remove('hidden');
          stepDescription.textContent = 'Enter the 4‑digit code from your email.';
          clearCodeInputs();
          clearMessage(codeMsg);
          verifyCodeBtn.disabled = false;
          startTimer(10);
        } else {
          showMessage(emailMsg, data.error || 'Something went wrong.', 'error');
          emailInput.classList.add('error');
        }
      } catch (err) {
        showMessage(emailMsg, 'Network error. Please try again.', 'error');
      } finally {
        sendCodeBtn.disabled = false;
        sendCodeBtn.innerHTML = '<i class="bi bi-envelope-fill me-2"></i> Send Reset Code';
      }
    });

    // Step 2: Verify code
    verifyCodeBtn.addEventListener('click', async () => {
      const code = getCode();
      if (code.length !== 4) {
        showMessage(codeMsg, 'Please enter the full 4‑digit code.', 'error');
        return;
      }
      clearMessage(codeMsg);
      verifyCodeBtn.disabled = true;
      verifyCodeBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verifying...';

      try {
        const response = await fetch('/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
          body: new URLSearchParams({ email: currentEmail, code })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          stopTimer();
          codeStep.classList.add('hidden');
          successStep.classList.remove('hidden');
          stepDescription.textContent = '';
        } else {
          showMessage(codeMsg, data.error || 'Invalid code.', 'error');
          clearCodeInputs();
        }
      } catch (err) {
        showMessage(codeMsg, 'Network error.', 'error');
      } finally {
        verifyCodeBtn.disabled = false;
        verifyCodeBtn.innerHTML = '<i class="bi bi-shield-check me-2"></i> Verify Code';
      }
    });

    // Resend code
    resendLink.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!currentEmail) return;
      resendLink.disabled = true;
      resendLink.textContent = 'Sending...';
      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
          body: new URLSearchParams({ email: currentEmail })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          clearCodeInputs();
          clearMessage(codeMsg);
          verifyCodeBtn.disabled = false;
          stopTimer();
          startTimer(10);
          showMessage(codeMsg, 'New code sent!', 'success');
        } else {
          showMessage(codeMsg, data.error || 'Could not resend.', 'error');
        }
      } catch (err) {
        showMessage(codeMsg, 'Network error.', 'error');
      } finally {
        resendLink.disabled = false;
        resendLink.textContent = 'Resend code';
      }
    });

    emailInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendCodeBtn.click();
    });

    const observer = new MutationObserver(() => {
      if (!codeStep.classList.contains('hidden') && document.activeElement !== digitInputs[0]) {
        digitInputs[0]?.focus();
      }
    });
    observer.observe(codeStep, { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
