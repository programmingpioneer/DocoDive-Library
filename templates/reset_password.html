<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password – DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f8faff, #e0e7ff); font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin:0; padding:20px; }
        .card { max-width: 440px; width:100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5">
        <h2 class="fw-bold mb-3 text-center">Set New Password</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">New Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold">Update Password</button>
        </form>
    </div>
</body>
</html>
