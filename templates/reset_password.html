<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password – DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4338ca;
            --primary-light: #818cf8;
            --accent: #ffb703;
            --dark: #1e1b4b;
            --bg: #f8faff;
            --text: #334155;
            --error: #ef4444;
            --success: #10b981;
            --border: #e0e7ff;
            --radius: 20px;
            --shadow: 0 20px 50px rgba(30,27,75,0.1);
            --transition: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: var(--text);
        }

        /* Decorative blobs */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.2;
            z-index: 0;
        }
        .blob-1 { width: 280px; height: 280px; background: var(--primary); top: -80px; left: -80px; }
        .blob-2 { width: 220px; height: 220px; background: var(--success); bottom: -60px; right: -60px; }
        .blob-3 { width: 160px; height: 160px; background: var(--primary-light); top: 50%; right: 5%; }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        /* Brand block */
        .brand-block {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInUp 0.5s ease-out;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 18px;
            margin-bottom: 10px;
            box-shadow: 0 10px 24px rgba(67,56,202,0.2);
            color: white;
            font-size: 1.7rem;
        }
        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
        }
        .brand-sub {
            color: #6b7280;
            font-size: 0.88rem;
            font-weight: 400;
        }

        /* Main card */
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 35px 28px 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(16,185,129,0.08);
            border-radius: 50%;
            margin-bottom: 12px;
        }
        .header .icon-circle i {
            font-size: 1.8rem;
            color: var(--success);
        }
        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            color: #6b7280;
        }

        /* Form elements */
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--dark);
            letter-spacing: 0.2px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all var(--transition);
            background: rgba(255,255,255,0.9);
        }
        .input-wrapper input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(67,56,202,0.1);
        }
        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .input-wrapper .toggle-password:hover {
            color: var(--primary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.2px;
        }
        .btn-success-custom {
            background: var(--success);
            color: #fff;
            box-shadow: 0 8px 20px rgba(16,185,129,0.25);
        }
        .btn-success-custom:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(16,185,129,0.35);
        }

        /* Alert */
        .alert {
            border-radius: 14px;
            font-size: 13px;
            padding: 12px 16px;
        }
        .alert-danger {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            color: var(--error);
        }
        .alert-success {
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.2);
            color: var(--success);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .back-link a:hover { text-decoration: underline; }

        .show-password-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
        }
        .show-password-label input[type="checkbox"] {
            transform: translateY(1px);
            accent-color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 500px) {
            body { padding: 16px; align-items: flex-start; padding-top: 40px; }
            .card { padding: 24px 18px 22px; border-radius: 24px; }
            .brand-title { font-size: 1.5rem; }
            .header h2 { font-size: 19px; }
            .bg-blob { display: none; }
            .btn { font-size: 14px; padding: 11px 16px; }
            .input-wrapper input { padding: 11px 40px 11px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- Decorative blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="container">
        <!-- Brand -->
        <div class="brand-block">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <h1 class="brand-title">DocoDive</h1>
            <p class="brand-sub">Secure Password Reset</p>
        </div>

        <div class="card">
            <div class="header">
                <div class="icon-circle"><i class="bi bi-key-fill"></i></div>
                <h2>Set New Password</h2>
                <p>Choose a strong password for your account.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" class="form-control-lg" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)" tabindex="-1">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <label class="show-password-label">
                        <input type="checkbox" onclick="togglePassword('password')"> Show Password
                    </label>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control-lg" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)" tabindex="-1">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <label class="show-password-label">
                        <input type="checkbox" onclick="togglePassword('confirm_password')"> Show Password
                    </label>
                </div>

                <button type="submit" class="btn btn-success-custom mt-2">
                    <i class="bi bi-shield-check me-2"></i> Update Password
                </button>
            </form>
        </div>

        <div class="back-link">
            <a href="/user/login"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            if (btn) {
                const icon = btn.querySelector('i');
                icon.className = isPassword ? 'bi bi-eye' : 'bi bi-eye-slash';
            }
        }
    </script>
</body>
</html>
