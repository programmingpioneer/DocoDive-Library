<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocoDive – Admin Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .admin-login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(30, 27, 75, 0.15);
            padding: 2.5rem 2rem;
        }
        .icon-circle {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #4338ca, #818cf8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 25px rgba(67,56,202,0.3);
        }
        .form-control {
            background: rgba(255,255,255,0.9);
            border: 1px solid #e0e7ff;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(67,56,202,0.15);
        }
        .btn-login {
            background: #1e1b4b;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px rgba(30, 27, 75, 0.3);
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #312e81;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(30, 27, 75, 0.4);
            color: white;
        }
        .alert {
            border-radius: 14px;
            font-size: 0.9rem;
        }
        .text-muted a, .back-link {
            transition: color 0.2s;
            color: #6b7280;
            text-decoration: none;
        }
        .back-link:hover {
            color: #4338ca;
        }
        label {
            color: #6b7280;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Show password toggle style */
        .show-password-label {
            color: #6b7280;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }
        .show-password-label input[type="checkbox"] {
            margin-right: 5px;
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="admin-login-card">
        <div class="text-center mb-4">
            <div class="icon-circle">
                <i class="bi bi-shield-lock-fill text-white" style="font-size: 2rem;"></i>
            </div>
            <h2 class="fw-bold mb-2" style="color: #1e1b4b; font-weight: 800;">Admin Vault</h2>
            <p class="text-muted small mb-0">Enter your credentials to manage the library.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 d-flex align-items-center gap-2 small fw-semibold py-2 px-3 rounded-3 shadow-sm" role="alert" style="background: rgba(220, 53, 69, 0.1); color: #b02a37; border-left: 4px solid #dc3545;">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="your@email.com" required autofocus>
            </div>
            <div class="mb-2">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required>
            </div>
            <!-- Show/Hide Password Toggle -->
            <div class="mb-4">
                <label class="show-password-label">
                    <input type="checkbox" id="showPassword" onclick="togglePassword()">
                    Show Password
                </label>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-lock-fill me-2"></i> Secure Login
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="back-link small"><i class="bi bi-arrow-left me-1"></i> Back to Library</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            var pwdField = document.getElementById("password");
            if (pwdField.type === "password") {
                pwdField.type = "text";
            } else {
                pwdField.type = "password";
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
