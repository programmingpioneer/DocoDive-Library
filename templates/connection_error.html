<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connection Lost – DocoDive</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 520px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(67, 56, 202, 0.15);
      }
      .icon {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #fee2e2;
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: #1e1b4b;
        margin-bottom: 12px;
      }
      .message {
        color: #6b7280;
        font-size: 0.95rem;
        margin-bottom: 28px;
        line-height: 1.6;
      }
      .btn-retry {
        background: #4338ca;
        color: #fff;
        padding: 12px 32px;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
      }
      .btn-retry:hover {
        background: #312e81;
        transform: translateY(-2px);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <i class="bi bi-wifi-off"></i>
      </div>
      <h1>Internet Connection Lost</h1>
      <p class="message">
        We couldn't reach our servers. Please check your internet connection
        and try again in a moment.
      </p>
      <a href="javascript:location.reload()" class="btn-retry">
        <i class="bi bi-arrow-clockwise me-2"></i> Try Again
      </a>
    </div>
  </body>
</html>
