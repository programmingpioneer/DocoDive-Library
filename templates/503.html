<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance – DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4338ca;
            --accent: #ffb703;
            --dark: #1e1b4b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Animated blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: 0;
            animation: floatBlob 8s infinite alternate ease-in-out;
        }
        .blob-1 { width: 300px; height: 300px; background: var(--primary); top: -100px; left: -100px; animation-duration: 7s; }
        .blob-2 { width: 250px; height: 250px; background: var(--accent); bottom: -80px; right: -80px; animation-duration: 9s; }
        .blob-3 { width: 180px; height: 180px; background: #818cf8; top: 60%; right: 5%; animation-duration: 10s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(20px, -30px) rotate(10deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(30,27,75,0.12);
            padding: 3rem 2rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            box-shadow: 0 15px 30px rgba(67,56,202,0.3);
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 20px 40px rgba(67,56,202,0.4); }
            100% { transform: scale(1); }
        }

        .icon-circle i {
            font-size: 3.5rem;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .code-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--dark);
            font-weight: 700;
            font-size: 1rem;
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 1.15rem;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 1.8rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .btn-primary-custom {
            background: var(--dark);
            color: #fff;
            box-shadow: 0 10px 20px rgba(30,27,75,0.25);
        }
        .btn-primary-custom:hover {
            background: #312e81;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(30,27,75,0.35);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .social-links {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(67,56,202,0.1);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
            text-decoration: none;
        }
        .social-links a:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-3px);
        }

        @media (max-width: 500px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 { font-size: 1.8rem; }
            .icon-circle {
                width: 80px;
                height: 80px;
            }
            .icon-circle i { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">
        <div class="icon-circle">
            <i class="bi bi-cone-striped"></i>
        </div>
        <span class="code-badge">503 · Maintenance</span>
        <h1>We'll Be Right Back!</h1>
        <p class="message">
            DocoDive is currently undergoing scheduled maintenance.<br>
            We're adding new books, improving performance, and polishing the experience.<br>
            Please check back soon – everything will be back to normal shortly.
        </p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary-custom">
                <i class="bi bi-arrow-clockwise"></i> Try Again
            </a>
            <a href="mailto:7t7sufyan@gmail.com" class="btn btn-outline">
                <i class="bi bi-envelope"></i> Contact Us
            </a>
        </div>
        <div class="social-links">
            <a href="https://t.me/Programmingpioneers" target="_blank" title="Telegram"><i class="bi bi-telegram"></i></a>
            <a href="https://github.com/programmingpioneer" target="_blank" title="GitHub"><i class="bi bi-github"></i></a>
            <a href="https://www.instagram.com/programmingpioneer/" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="https://www.facebook.com/Programmingpioneer" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
        </div>
    </div>

    <!-- Brevo Conversations Widget – so users can chat with you even during maintenance -->
    <script>
        (function(d, w, c) {
            w.BrevoConversationsID = '6a551981edd95b5e7d08467b';
            w[c] = w[c] || function() {
                (w[c].q = w[c].q || []).push(arguments);
            };
            var s = d.createElement('script');
            s.async = true;
            s.src = 'https://conversations-widget.brevo.com/brevo-conversations.js';
            if (d.head) d.head.appendChild(s);
        })(document, window, 'BrevoConversations');
    </script>
</body>
</html>
