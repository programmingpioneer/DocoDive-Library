<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>400 – Bad Request | DocoDive</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(30, 27, 75, 0.1);
        padding: 40px 30px;
        max-width: 450px;
        width: 90%;
        text-align: center;
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        color: #f59e0b;
        margin-bottom: 10px;
      }
      .message {
        font-size: 1.1rem;
        color: #6b7280;
        margin-bottom: 25px;
      }
      .btn-home {
        background: #1e1b4b;
        color: #fff;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
      }
      .btn-home:hover {
        background: #312e81;
        transform: translateY(-2px);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">400</div>
      <h3 class="fw-bold" style="color: #1e1b4b">Bad Request</h3>
      <p class="message">
        The request could not be understood by the server. Please check your
        input and try again.
      </p>
      <a href="/" class="btn-home"
        ><i class="bi bi-house-door me-2"></i> Back to Home</a
      >
    </div>
  </body>
</html>
