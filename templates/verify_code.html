<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code – DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f8faff, #e0e7ff); font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin:0; padding:20px; }
        .card { max-width: 440px; width:100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5">
        <h2 class="fw-bold mb-3 text-center">Enter Verification Code</h2>
        <p class="text-muted text-center">A 4‑digit code was sent to <strong>{{ email }}</strong></p>
        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Verification Code</label>
                <input type="text" name="code" class="form-control form-control-lg text-center" placeholder="1234" maxlength="4" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold">Verify & Send Reset Link</button>
        </form>
        <div class="text-center mt-3">
            <a href="/user/login" class="text-muted small">Back to Login</a>
        </div>
    </div>
</body>
</html>
