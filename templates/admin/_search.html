<form method="get" class="studio-search"><label for="studio-search" class="visually-hidden">Search</label><input id="studio-search" class="form-control" type="search" name="q" value="{{ q|default('') }}" placeholder="Search records…" maxlength="100"><button class="btn btn-primary" type="submit">Search</button>{% if q %}<a class="btn btn-outline-secondary" href="{{ url_for(request.endpoint) }}">Clear</a>{% endif %}</form>
