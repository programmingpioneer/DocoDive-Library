{% extends 'admin/admin_base.html' %}{% block content %}<div class="studio-heading"><h1>Edit user</h1><a href="{{ url_for('admin.list_users') }}">Back to users</a></div><form method="post" class="studio-form"><input type="hidden" name="_csrf_token" value="{{ session.get('_csrf_token','') }}">
{% for key,label,type,maxlen in [('username','Username','text',30),('email','Email','email',254),('first_name','First name','text',100),('last_name','Last name','text',100)] %}<label for="{{ key }}">{{ label }}</label><input class="form-control" type="{{ type }}" name="{{ key }}" id="{{ key }}" value="{{ user[key] or '' }}" maxlength="{{ maxlen }}" {% if key in ['username','email'] %}required{% endif %}>{% endfor %}
<label for="role">Role</label><select class="form-select" id="role" name="role" {% if not studio_user.owner %}disabled{% endif %}><option value="user" {% if user.role=='user' %}selected{% endif %}>Reader</option><option value="admin" {% if user.role=='admin' %}selected{% endif %}>Studio administrator</option></select><label class="studio-check"><input type="checkbox" name="verified" {% if user.verified %}checked{% endif %}> Email verified</label><button class="btn btn-primary" type="submit">Save user</button></form>{% endblock %}
