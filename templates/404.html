<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found – DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f8faff, #e0e7ff); display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Poppins', sans-serif; margin:0; padding:20px; }
        .error-card { text-align: center; }
        .error-card h1 { font-size: 6rem; font-weight: 800; color: #1e1b4b; margin-bottom: 0; }
        .error-card p { color: #6b7280; font-size: 1.2rem; margin: 10px 0 20px; }
        .btn-home { background: #1e1b4b; color: #fff; border-radius: 50px; padding: 12px 30px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-home:hover { background: #312e81; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/" class="btn-home"><i class="bi bi-house-door me-2"></i> Back to Home</a>
    </div>
</body>
</html>
