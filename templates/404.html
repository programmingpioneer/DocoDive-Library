<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | DocoDive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #4338ca;
            --accent: #ffb703;
            --dark: #1e1b4b;
            --bg: #f8faff;
            --border: #e0e7ff;
            --shadow: 0 20px 50px rgba(30,27,75,0.1);
            --transition: 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8faff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: var(--dark);
        }

        /* Decorative background blobs */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.2;
            z-index: 0;
        }
        .blob-1 { width: 300px; height: 300px; background: var(--primary); top: -100px; left: -100px; }
        .blob-2 { width: 250px; height: 250px; background: var(--accent); bottom: -80px; right: -80px; }
        .blob-3 { width: 180px; height: 180px; background: #818cf8; top: 30%; right: 10%; }

        .container-main {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 24px;
            margin-bottom: 20px;
            box-shadow: 0 12px 24px rgba(67,56,202,0.2);
            color: white;
            font-size: 2.5rem;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 40px 30px 35px;
            max-width: 500px;
            width: 100%;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
        }

        .message {
            font-size: 1.2rem;
            color: #6b7280;
            margin: 0 0 25px;
            line-height: 1.4;
        }

        .btn-primary-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 30px;
            background: var(--dark);
            color: #fff;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px rgba(30,27,75,0.3);
            transition: all var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-primary-custom:hover {
            background: #312e81;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(30,27,75,0.4);
            color: #fff;
        }

        .btn-primary-custom i {
            font-size: 1.2rem;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            .error-card {
                padding: 30px 20px 25px;
            }
            .error-code {
                font-size: 4rem;
            }
            .message {
                font-size: 1rem;
            }
            .brand-icon {
                width: 60px;
                height: 60px;
                font-size: 2rem;
                border-radius: 18px;
            }
            .bg-blob { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="container-main">
        <div class="brand-icon">
            <i class="bi bi-book-half"></i>
        </div>
        <div class="error-card">
            <div class="error-code">404</div>
            <p class="message">Oops! The page you're looking for doesn't exist.<br>It may have been moved or deleted.</p>
            <a href="/" class="btn-primary-custom">
                <i class="bi bi-house-door me-2"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
